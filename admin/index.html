<!DOCTYPE html>
<html lang="pt-BR" data-admin>
<head>
    <meta charset="UTF-8">
    <title>Administração - Bsoft TMS IA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#1c1917">
    <!-- Segurança: só roda scripts desta pasta e do CDN do Supabase (com verificação SRI). Sem scripts embutidos nem eval:
         mesmo que algum texto malicioso chegue à tela (ex.: uma resposta da IA), ele não consegue executar código. -->
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23fb923c'/%3E%3Cstop offset='1' stop-color='%23ea580c'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle'%3E🔑%3C/text%3E%3C/svg%3E">
    <script src="js/tema.js?v=28.1.4" charset="utf-8"></script>
    <script src="../js/core/fontes.js?v=28.1.4" charset="utf-8"></script>
    <link rel="stylesheet" href="../css/tokens.css?v=28.1.4">
    <link rel="stylesheet" href="admin.css?v=28.1.4">
    <!-- Supabase: mesma versão fixa + verificação de integridade (SRI) do sistema principal -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
</head>
<body>
<div class="aurora" aria-hidden="true"></div>

<noscript><p style="padding:24px;font-family:sans-serif">Esta área precisa de JavaScript habilitado.</p></noscript>

<!-- ═══════════ Entrada (senha) ═══════════ -->
<main id="login" class="login" hidden>
    <form id="formLogin" class="login-card" autocomplete="off" novalidate>
        <div class="login-logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></svg>
        </div>
        <h1>Área administrativa</h1>
        <p class="login-sub">Bsoft TMS · Suporte IA</p>
        <div id="loginModoSup" class="aviso" hidden></div>
        <label class="campo" id="campoNome" hidden>
            <span class="rot">Seu nome <span class="mu" style="text-transform:none;font-weight:500">(opcional — aparece no histórico de revisões)</span></span>
            <input type="text" id="loginNome" maxlength="40" autocomplete="name" placeholder="Ex.: Lucas">
        </label>
        <label class="campo">
            <span class="rot" id="loginRotulo">Senha</span>
            <div class="senha-wrap">
                <input type="password" id="loginSenha" autocomplete="current-password" required autofocus>
                <button type="button" class="btn fantasma icone peq" id="loginOlho" aria-label="Mostrar a senha" title="Mostrar/ocultar a senha">👁</button>
            </div>
        </label>
        <div id="loginMsg" class="login-msg" role="alert" aria-live="polite"></div>
        <button class="btn primario grande" id="loginEntrar" type="submit">Entrar</button>
        <p class="login-dica" id="loginDica"></p>
    </form>
</main>

<!-- ═══════════ Painel (abas) ═══════════ -->
<div id="app" hidden>
    <header class="topo">
        <div class="marca">
            <span class="logo" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></svg>
            </span>
            <span>Administração<small>Bsoft TMS · IA</small></span>
        </div>
        <nav id="abas" class="abas" role="tablist" aria-label="Seções da área administrativa"></nav>
        <div class="topo-acoes">
            <span id="chipBanco" class="chip" title="Conexão com o banco de dados (Supabase)"><span class="ponto"></span><span id="chipBancoTxt">banco…</span></span>
            <button id="btnTema" class="btn fantasma icone" type="button" title="Alternar tema claro/escuro" aria-label="Alternar tema claro/escuro">🌓</button>
            <a id="btnAbrirApp" class="btn fantasma" href="../index.html" target="_blank" rel="noopener" title="Abrir o sistema de suporte em outra guia"><span class="rot-btn">Abrir o sistema</span><span class="ic-slot" data-ic="ext" aria-hidden="true"></span></a>
            <button id="btnSair" class="btn" type="button" title="Encerrar a sessão administrativa"><span class="rot-btn">Sair</span><span class="ic-slot" data-ic="logout" aria-hidden="true"></span></button>
        </div>
    </header>
    <main id="painel" class="painel"></main>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="modalRoot"></div>

<!-- Scripts comuns (sem módulos), na ordem: funcionam no GitHub Pages, em localhost e abrindo o arquivo direto no computador -->
<script src="../config/app-config.js?v=28.1.4" charset="utf-8"></script>
<script src="../config/admin-config.js" charset="utf-8"></script>
